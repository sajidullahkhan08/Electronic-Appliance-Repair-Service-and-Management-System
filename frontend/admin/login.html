<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — ElectroFix</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>

<body class="admin-body" style="display: block">
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <div class="icon">⚡</div>
        <h1>Electro<span style="color: var(--blue-light)">Fix</span></h1>
        <p>Admin Panel — Secure Access</p>
      </div>

      <div id="login-error" class="alert-box alert-error" style="display:none;"></div>

      <form id="login-form" style="display: flex; flex-direction: column; gap: 18px">
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <div class="phone-input-wrap">
            <input type="tel" id="phone" name="phone" placeholder="03001234567" autocomplete="tel" maxlength="15"
              required />
          </div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password"
            required />
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 14px">
          Log In →
        </button>
      </form>

      <p style="text-align:center;margin-top:20px;font-size:0.82rem;color:var(--text-3);">
        <a href="/index.html" style="color:var(--text-2)">← Back to Website</a>
      </p>
    </div>
  </div>
  <script src="/js/config.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    // Redirect if already logged in
    fetch(
      `${window.apiUrl ? window.apiUrl('/admin/check-auth') : '/api/admin/check-auth'}`,
      { credentials: 'include' }
    )
      .then(r => r.json())
      .then(d => { if (d.authenticated) window.location.href = '/admin/dashboard.html'; })
      .catch(() => { });
  </script>
</body>

</html>
